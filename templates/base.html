<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Barbearia Balhego{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/img/icon.ico">
    <script>
        // Blocking theme detection — runs before any CSS to prevent flash
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('theme', theme);

            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (event) => {
                document.documentElement.setAttribute('theme', event.matches ? 'light' : 'dark');
            });
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/modals.css">
    {% block styles %}{% endblock %}
    {% block head %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <!-- Global JS -->
    <script src="/static/js/global.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
