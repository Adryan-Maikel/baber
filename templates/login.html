{% extends "base.html" %}

{% block title %}Login - Admin{% endblock %}

{% block head %}
<style>
    /* Hide theme toggle on login page for cleaner look */
    .theme-toggle {
        display: flex;
    }

    /* Toast notification */
    .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 1rem 1.5rem;
        border-radius: 8px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        transform: translateX(150%);
        transition: transform 0.3s ease;
        z-index: 1000;
        max-width: 350px;
    }

    .toast.show {
        transform: translateX(0);
    }

    .toast.error {
        border-color: var(--danger);
        background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), var(--card));
    }

    .toast.warning {
        border-color: #f1c40f;
        background: linear-gradient(135deg, rgba(241, 196, 15, 0.1), var(--card));
    }

    .toast-content {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .toast-icon {
        font-size: 1.25rem;
    }

    .toast.error .toast-icon {
        color: var(--danger);
    }

    .toast.warning .toast-icon {
        color: #f1c40f;
    }

    .toast-message {
        flex: 1;
    }

    .toast-title {
        font-weight: 600;
        margin-bottom: 0.25rem;
    }

    .toast-text {
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    /* Countdown timer */
    .countdown {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        margin-left: auto;
    }

    /* Disabled button state */
    .btn-disabled {
        opacity: 0.6;
        cursor: not-allowed;
        pointer-events: none;
    }

    /* Logo styling */
    .login-logo {
        width: 100px;
        height: 100px;
        object-fit: contain;
    }

    /* Validação de campos */
    input.has-error {
        border-color: var(--danger) !important;
        animation: shake 0.4s ease;
    }

    @keyframes shake {

        0%,
        100% {
            transform: translateX(0);
        }

        20% {
            transform: translateX(-8px);
        }

        40% {
            transform: translateX(8px);
        }

        60% {
            transform: translateX(-5px);
        }

        80% {
            transform: translateX(5px);
        }
    }

    .input-error-text {
        color: var(--danger);
        font-size: 0.75rem;
        margin-top: -0.25rem;
    }

    /* Botões estilo quick-date-btn */
    .login-btn {
        background: transparent;
        border: 1px solid var(--text-primary);
        color: var(--text-primary);
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .login-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .login-btn.muted {
        border-color: var(--text-secondary);
        color: var(--text-secondary);
        opacity: 0.75;
    }

    .login-btn.muted:hover {
        opacity: 0.90;
        border-color: var(--text-primary);
        color: var(--text-primary);
    }
</style>
{% endblock %}

{% block content %}
<!-- Toast notification container -->
<div id="toast" class="toast">
    <div class="toast-content">
        <i id="toast-icon" class="toast-icon fa-solid fa-exclamation-circle"></i>
        <div class="toast-message">
            <div id="toast-title" class="toast-title"></div>
            <div id="toast-text" class="toast-text"></div>
        </div>
        <div id="countdown" class="countdown"></div>
    </div>
</div>

<div class="h-100dvh column center pd-1">
    <div class="login-card fade-in mb-5">
        <div class="text-center">
            <img src="/static/img/icon.png" alt="Logo" class="login-logo">
            <h1 class="frufru">Barbearia Balhego</h1>
            <p>Acesse o painel administrativo</p>
        </div>

        <div id="error-message" class="error-message">
            Usuário ou senha incorretos
        </div>

        <form id="login-form" class="column gap-05">
            <label for="username">
                <i class="fa-solid fa-user"></i> Usuário
            </label>
            <input type="text" id="username" name="username" placeholder="Digite seu usuário" required
                autocomplete="username">
            <span id="username-error" class="input-error-text" style="display: none;">Informe o usuário</span>

            <label for="password">
                <i class="fa-solid fa-lock"></i> Senha
            </label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required
                autocomplete="current-password">
            <span id="password-error" class="input-error-text" style="display: none;">Informe a senha</span>

            <div class="row gap-05">
                <button type="button" id="submit-btn" class="login-btn" onclick="doLogin()">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span id="btn-text">Entrar</span>
                </button>
                <button type="button" class="login-btn muted" onclick="resetForm()">
                    <i class="fa-solid fa-xmark"></i>
                    Limpar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    let lockoutEndTime = null;
    let countdownInterval = null;

    function showToast(type, title, text, seconds = null) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        const titleEl = document.getElementById('toast-title');
        const textEl = document.getElementById('toast-text');
        const countdown = document.getElementById('countdown');

        toast.className = `toast ${type} show`;
        titleEl.textContent = title;
        textEl.textContent = text;

        if (type === 'error') {
            icon.className = 'toast-icon fa-solid fa-exclamation-circle';
        } else if (type === 'warning') {
            icon.className = 'toast-icon fa-solid fa-clock';
        }

        if (seconds) {
            countdown.textContent = seconds + 's';
        } else {
            countdown.textContent = '';
        }

        // Auto-hide after 5 seconds if no countdown
        if (!seconds) {
            setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }
    }

    function hideToast() {
        document.getElementById('toast').classList.remove('show');
    }

    function startLockout(seconds) {
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        lockoutEndTime = Date.now() + (seconds * 1000);
        submitBtn.classList.add('btn-disabled');

        function updateCountdown() {
            const remaining = Math.ceil((lockoutEndTime - Date.now()) / 1000);

            if (remaining <= 0) {
                clearInterval(countdownInterval);
                lockoutEndTime = null;
                submitBtn.classList.remove('btn-disabled');
                btnText.textContent = 'Entrar';
                hideToast();
                return;
            }

            btnText.textContent = `Aguarde ${remaining}s`;
            document.getElementById('countdown').textContent = remaining + 's';
        }

        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);

        showToast('warning', 'Muitas tentativas', 'Você foi temporariamente bloqueado.', seconds);
    }

    function resetForm() {
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        usernameInput.value = '';
        passwordInput.value = '';
        usernameInput.classList.remove('has-error');
        passwordInput.classList.remove('has-error');
        document.getElementById('username-error').style.display = 'none';
        document.getElementById('password-error').style.display = 'none';
        document.getElementById('error-message').classList.remove('show');
        hideToast();
    }

    async function doLogin() {
        // Check if currently locked out
        if (lockoutEndTime && Date.now() < lockoutEndTime) {
            return;
        }

        const errorDiv = document.getElementById('error-message');
        errorDiv.classList.remove('show');
        hideToast();

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        // Limpa erros anteriores
        usernameInput.classList.remove('has-error');
        passwordInput.classList.remove('has-error');
        document.getElementById('username-error').style.display = 'none';
        document.getElementById('password-error').style.display = 'none';

        let hasError = false;

        if (!username) {
            usernameInput.classList.add('has-error');
            document.getElementById('username-error').style.display = 'block';
            hasError = true;
        }
        if (!password) {
            passwordInput.classList.add('has-error');
            document.getElementById('password-error').style.display = 'block';
            hasError = true;
        }

        if (hasError) {
            return;
        }

        try {
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData
            });

            if (response.status === 429) {
                const retryAfter = parseInt(response.headers.get('Retry-After')) || 30;
                startLockout(retryAfter);
                return;
            }

            if (!response.ok) {
                const data = await response.json();
                const waitMatch = data.detail && data.detail.match(/Aguarde (\d+) segundos/);
                if (waitMatch) {
                    startLockout(parseInt(waitMatch[1]));
                } else {
                    // Treme a senha e mostra mensagem
                    passwordInput.classList.add('has-error');
                    const pwdError = document.getElementById('password-error');
                    pwdError.textContent = data.detail || 'Usuário ou senha incorretos';
                    pwdError.style.display = 'block';
                }
                passwordInput.value = '';
                return;
            }

            const data = await response.json();
            localStorage.setItem('access_token', data.access_token);
            window.location.href = '/panel';

        } catch (error) {
            showToast('error', 'Erro', 'Falha na conexão com o servidor');
            document.getElementById('password').value = '';
        }
    }
</script>
{% endblock %}
